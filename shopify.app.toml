# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration
#
# `client_id` / `application_url` are filled in automatically the first time
# you run `npm run config:link` and connect this codebase to an app you
# create in the Partner Dashboard. Do not hand-edit them beforehand.

client_id = "40062f0e1e7d715a2012f254b3adc1e9"
name = "AI Glasses Try-On"
handle = "ai-glasses-try-on"
application_url = "https://try-on-shopify.onrender.com"
embedded = true

[access_scopes]
scopes = "read_products"

[auth]
# Only one is actually used: authPathPrefix: "/auth" in shopify.server.js
# means the OAuth callback route this app serves is exactly /auth/callback.
redirect_urls = [
  "https://try-on-shopify.onrender.com/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory GDPR compliance webhooks — required for every public app.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

  # Keeps ShopSettings.plan in sync when a merchant cancels, upgrades, or a
  # charge is declined — independent of whether they were in the app at the time.
  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app_subscriptions/update"

[app_proxy]
# Storefront calls to https://{shop}/apps/tryon/config are forwarded here
# with a verified signature — the only thing it returns is a public
# storeId. The actual try-on flow talks directly to Lumi Frame's own API
# from the browser (see README.md); nothing secret ever passes through here.
url = "https://try-on-shopify.onrender.com/apps/tryon"
subpath = "tryon"
prefix = "apps"

[pos]
embedded = false

[build]
include_config_on_deploy = true
